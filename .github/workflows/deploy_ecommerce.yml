name: Deploy Ecommerce to PROD

on:
  push:
    branches:
      - main
    paths:
      - 'ecommerce_lakehouse/**'
      - '.github/workflows/deploy_ecommerce.yml'  # <-- Add this line

jobs:
  deploy:
    name: "Automated Deployment to Prod"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Deploy Bundle to PROD
        working-directory: ./ecommerce_lakehouse   # Points to the second project
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          databricks bundle deploy -t prod
          databricks bundle run -t prod ecommerce_daily_job