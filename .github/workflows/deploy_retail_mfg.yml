name: Deploy Retail & Mfg Lakehouse to PROD/QA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - qa
    paths:
      - 'retail_mfg_lakehouse/**'
      - '.github/workflows/deploy_retail_mfg.yml'

jobs:
  deploy:
    name: "Automated Databricks Bundle Deployment"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Deploy and Run Bundle (QA or PROD)
        working-directory: ./retail_mfg_lakehouse
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "Promoting to PRODUCTION (prod target)..."
            databricks bundle deploy -t prod
            databricks bundle run -t prod retail_mfg_daily_job
          else
            echo "Promoting to STAGING (qa target)..."
            databricks bundle deploy -t qa
            databricks bundle run -t qa retail_mfg_daily_job
          fi